name: Homelab - Build & Deploy

on:
  push:
    branches:
      - savestate-main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CODE_REPO: ${{ github.event.repository.name }}
  IMAGE_NAME: ${{ github.repository }}
  INFRA_REPO: nantomarioni/homelab-manifests
  VITE_SERVER_URL: https://pokerogue.antomarioni.com/rogueapi

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout code (with game asset submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.sha_short }}
            type=raw,value=savestate-main

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          build-args: |
            VITE_SERVER_URL=${{ env.VITE_SERVER_URL }}
            VITE_COMMIT_HASH=${{ steps.vars.outputs.sha_short }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: runnumber=${{ github.run_id }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Update Infra Repo
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ -z "${{ secrets.INFRA_REPO_TOKEN }}" ]; then echo "TOKEN IS EMPTY"; else echo "TOKEN IS SET"; fi
          git config --global user.email "ci-bot@gmail.com"
          git config --global user.name "CI Bot"

          git clone https://x-access-token:${INFRA_TOKEN}@github.com/${{ env.INFRA_REPO }}.git infra-repo
          cd infra-repo/apps/${CODE_REPO}

          yq -i '.image.tag = "'"${NEW_TAG}"'"' values.yaml

          # Idempotent: a re-run (or manual pin) may leave nothing to commit
          if git diff --quiet; then
            echo "Tag already at ${NEW_TAG}; nothing to deploy."
            exit 0
          fi

          git add values.yaml
          git commit -m "feat(${{ env.CODE_REPO }}): deploy version ${NEW_TAG}"
          git push
