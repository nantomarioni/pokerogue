# nginx config for self-hosted PokéRogue (savestate fork).
# Serves the static Vite build and proxies /rogueapi/* to the official API,
# overriding Origin/Referer because api.pokerogue.net rejects other origins.
# Loaded into the http{} context via /etc/nginx/conf.d/.

# Modest rate limit for the API relay so the public endpoint can't be abused
# as an anonymous proxy to the official API.
limit_req_zone $binary_remote_addr zone=rogueapi:10m rate=10r/s;

# Upstream DNS must be resolved at runtime (container has no /etc/hosts entry)
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # API relay to the official server (same trick as the local dev proxy)
    location /rogueapi/ {
        limit_req zone=rogueapi burst=30 nodelay;

        # Variable forces per-request DNS resolution via the resolver above
        set $rogue_upstream https://api.pokerogue.net;
        rewrite ^/rogueapi/(.*)$ /$1 break;
        proxy_pass $rogue_upstream;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.pokerogue.net;
        proxy_set_header Origin https://pokerogue.net;
        proxy_set_header Referer https://pokerogue.net/;
        proxy_set_header User-Agent $http_user_agent;
        proxy_read_timeout 30s;
    }

    # Hashed bundle files are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Game media (not content-hashed): cache but revalidate daily
    location ~ ^/(images|audio|battle-anims|fonts|locales|exp-sprites)/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
